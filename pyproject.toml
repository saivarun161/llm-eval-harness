[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "An evaluation harness for LLM applications where every score carries a confidence interval"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Varun Kammadanam" }]
requires-python = ">=3.11"
keywords = [
    "llm",
    "evaluation",
    "benchmarking",
    "llm-as-judge",
    "bootstrap",
    "regression-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# The harness has no runtime dependencies. Everything it needs to score, embed
# and run statistics on a result set is in the standard library, so `pip install
# llm-eval-harness` never drags a numerical stack into a CI image.
dependencies = []

[project.optional-dependencies]
# Optional: swaps the deterministic heuristic judge for a real model. Nothing
# else in the harness changes, and every test runs without this installed.
judge = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
evalharness = "evalharness.cli:main"

[project.urls]
Homepage = "https://github.com/saivarun161/llm-eval-harness"
Issues = "https://github.com/saivarun161/llm-eval-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: needs a reachable model endpoint (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff only honours .gitignore inside a git work tree; naming the virtualenv
# here keeps `ruff check .` clean in a bare checkout too.
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.coverage.run]
source = ["src/evalharness"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
